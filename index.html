<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play a local two-player game of tic-tac-toe with keyboard-friendly controls.">
    <link rel="stylesheet" href="style.css">
    <title>JustTicTacToe — Two-player game</title>
</head>
<body>
    <header id="navbar"><h1>JustTicTacToe.</h1></header>
    <main>
        <p id="instructions">Two players on one device. X starts.<br>Use Tab to choose a square and Enter or Space to play.</p>
        <h2 id="playtext" role="status" aria-live="polite" aria-atomic="true">Player 1 (X) to play</h2>
        <button type="button" id="reset">Restart</button>
        <div id="container">
            <p id="player1" class="player">Player 1 <strong>X</strong></p>
            <div id="main" role="group" aria-label="Tic-tac-toe board" aria-describedby="instructions">
                <button type="button" id="0" class="col" aria-label="Row 1, column 1: empty"></button>
                <button type="button" id="1" class="col" aria-label="Row 1, column 2: empty"></button>
                <button type="button" id="2" class="col" aria-label="Row 1, column 3: empty"></button>
                <button type="button" id="3" class="col" aria-label="Row 2, column 1: empty"></button>
                <button type="button" id="4" class="col" aria-label="Row 2, column 2: empty"></button>
                <button type="button" id="5" class="col" aria-label="Row 2, column 3: empty"></button>
                <button type="button" id="6" class="col" aria-label="Row 3, column 1: empty"></button>
                <button type="button" id="7" class="col" aria-label="Row 3, column 2: empty"></button>
                <button type="button" id="8" class="col" aria-label="Row 3, column 3: empty"></button>
            </div>
            <p id="player2" class="player">Player 2 <strong>O</strong></p>
        </div>
        <noscript>This game needs JavaScript enabled to play.</noscript>
    </main>
    <script src="script.js"></script>
</body>
</html>
